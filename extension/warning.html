<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>위험 사이트 경고</title>
  <style>
    body { font-family: sans-serif; background: #7f1d1d; color: #fff;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; }
    .box { max-width: 560px; text-align: center; }
    h1 { font-size: 1.6rem; }
    code { background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 4px; }
    .note { opacity: .85; font-size: .9rem; margin-top: 1rem; }
    button { margin: 1.2rem .4rem 0; padding: .6rem 1.2rem; border: 0;
             border-radius: 6px; cursor: pointer; font-size: 1rem; }
    #back { background: #fff; color: #7f1d1d; font-weight: bold; }
    #go { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
  </style>
</head>
<body>
  <div class="box">
    <h1>이 사이트는 피싱 차단 리스트에 있습니다</h1>
    <p><code id="domain"></code></p>
    <p class="note">이 확인은 동형암호로 수행되어, 검사 서버는 어떤 도메인을
       확인했는지 알 수 없습니다.</p>
    <button id="back">돌아가기</button>
    <button id="go">위험을 알고 계속 방문</button>
  </div>
  <script src="warning.js"></script>
</body>
</html>
